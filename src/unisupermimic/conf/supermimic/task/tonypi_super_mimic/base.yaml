  events:
    startup_context:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.SuperMimicContextEvent
      mode: startup
      params:
        command_name: motion
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
        ground_asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: ground
          geom_names:
          - floor
    reset_context:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.SuperMimicContextEvent
      mode: reset
      params:
        command_name: motion
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
        ground_asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: ground
          geom_names:
          - floor
    joint_offsets:
      _target_: unilab.managers.EventTermCfg
      func: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.SuperMimicJointOffsetEvent
      mode: reset
      params:
        command_name: motion
  terminations:
    hard:
      _target_: unilab.managers.TerminationTermCfg
      func: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.supermimic_termination
      params:
        command_name: motion
    timeout:
      _target_: unilab.managers.TerminationTermCfg
      func: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.supermimic_timeout
      time_out: true
      params:
        command_name: motion
    clip_end:
      _target_: unilab.managers.TerminationTermCfg
      func: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.supermimic_clip_end
      time_out: true
      params:
        command_name: motion
  policy_observation_group: policy
  critic_observation_group: future
reward:
  tracking:
    _target_: unilab.managers.RewardTermCfg
    func: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.supermimic_reward
    weight: 1.0
    params:
      command_name: motion
