# @package _global_
env:
  seed: null
  scene:
    model_file: src/unisupermimic/assets/robots/tonypi/scene.xml
    default_keyframe_name: stand
    entities:
      robot:
        root_body_name: torso
        joint_names: &id001
        - l_ankle_roll
        - l_ankle_pitch
        - l_knee
        - l_hip_pitch
        - l_hip_roll
        - l_elbow
        - l_shoulder_roll
        - l_shoulder_pitch
        - r_ankle_roll
        - r_ankle_pitch
        - r_knee
        - r_hip_pitch
        - r_hip_roll
        - r_elbow
        - r_shoulder_roll
        - r_shoulder_pitch
        actuator_names: *id001
        body_names:
        - torso
        - l_hip_roll
        - l_knee
        - l_ankle_roll
        - l_shoulder_pitch
        - l_shoulder_roll
        - l_elbow
        - r_hip_roll
        - r_knee
        - r_ankle_roll
        - r_shoulder_pitch
        - r_shoulder_roll
        - r_elbow
        geom_names:
        - torso_col
        - head_pan_col
        - head_tilt_col
        - r_hip_roll_col
        - r_hip_pitch_col
        - r_knee_col
        - r_ankle_pitch_col
        - r_ankle_roll_sole
        - r_shoulder_pitch_col
        - r_shoulder_roll_col
        - r_elbow_col
        - r_gripper_col
        - r_gripper_pad1
        - r_gripper_pad2
        - r_gripper_pad3
        - l_hip_roll_col
        - l_hip_pitch_col
        - l_knee_col
        - l_ankle_pitch_col
        - l_ankle_roll_sole
        - l_shoulder_pitch_col
        - l_shoulder_roll_col
        - l_elbow_col
        - l_gripper_col
        - l_gripper_pad1
        - l_gripper_pad2
        - l_gripper_pad3
      ground:
        geom_names:
        - floor
  sim_dt: 0.004
  ctrl_dt: 0.02
  max_episode_seconds: 30.0
  auto_reset: true
  scale_rewards_by_dt: false
  observations:
    policy:
      enable_corruption: false
      terms:
        obs:
          func: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.supermimic_obs
          params:
            command_name: motion
    future:
      enable_corruption: false
      terms:
        goal:
          func: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.supermimic_goal
          params:
            command_name: motion
            num_frames: 10
  actions:
    joint_pos:
      _target_: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.SuperMimicActionCfg
      entity_name: robot
      command_name: motion
  commands:
    motion:
      _target_: unisupermimic.tasks.motion_tracking.tonypi.supermimic.manager_terms.SuperMimicCommandCfg
      entity_name: robot
      mjcf_path: src/unisupermimic/assets/robots/tonypi/robot.xml
      eval_mode: false
      gamma: 0.99
      src_fps: 50.0
      reset_noise: true
      max_episode_steps: 1500
      goal_frames: 10
      context_dim: 20
      w_amp: 0.0
      amp_tol: 0.02
      amp_scale: 0.5
      amp_min_height: 0.1
      amp_ankles:
      - 3
      - 9
      w_speed: 0.0
      speed_min: 2.0
      speed_tol: 0.3
      speed_scale: 1.5
      speed_bodies:
      - 3
      - 6
      - 9
      - 12
      resampling_time_range:
      - 1.0e9
      - 1.0e9
      motion_files:
      - src/unisupermimic/assets/motions/tonypi/train/single_0_base.csv
      - src/unisupermimic/assets/motions/tonypi/train/single_17_soft.csv
